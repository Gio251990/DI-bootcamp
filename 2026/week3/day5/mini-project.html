<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <style>
        body {
            font-family: Arial;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #eee;
            margin-top: 10px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 5px;
        }

        .completed {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Todo List</h1>

        <div class="input-area">
            <input type="text" id="taskInput" placeholder="Scrivi una task">
            <button onclick="addTask()">Aggiungi</button>
        </div>

        <ul id="taskList"></ul>

    </div>

    <script>

        function addTask() {

            const input = document.getElementById("taskInput");
            const taskText = input.value;

            if (taskText === "") {
                alert("Inserisci una task");
                return;
            }

            const li = document.createElement("li");

            li.innerHTML = `
        <span onclick="toggleTask(this)">
            ${taskText}
        </span>

        <button onclick="deleteTask(this)">
            ❌
        </button>
    `;

            document.getElementById("taskList").appendChild(li);

            input.value = "";
        }

        function deleteTask(button) {
            button.parentElement.remove();
        }

        function toggleTask(element) {
            element.classList.toggle("completed");
        }

    </script>

</body>

</html>
