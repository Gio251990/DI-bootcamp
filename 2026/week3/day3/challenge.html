<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <title>Mad Libs</title>

    <style>
        body {
            font-family: Arial;
            padding: 20px;
        }

        input {
            margin: 5px 0;
            padding: 5px;
        }

        button {
            margin-top: 10px;
            padding: 8px;
            cursor: pointer;
        }

        #story {
            font-weight: bold;
            color: blue;
        }
    </style>

</head>

<body>

    <h1>Mad Libs</h1>

    <form id="libform">

        <label for="noun">
            Noun:
        </label>

        <input type="text" id="noun">
        <br>

        <label for="adjective">
            Adjective:
        </label>

        <input type="text" id="adjective">
        <br>

        <label for="person">
            Someone's Name:
        </label>

        <input type="text" id="person">
        <br>

        <label for="verb">
            Verb:
        </label>

        <input type="text" id="verb">
        <br>

        <label for="place">
            A place:
        </label>

        <input type="text" id="place">
        <br>

        <button id="lib-button">
            Lib it!
        </button>

    </form>

    <br>

    <button id="shuffle">
        Shuffle Story
    </button>

    <p>

        Generated story:

        <span id="story"></span>

    </p>

    <script>

        const form = document.getElementById("libform");

        const storySpan = document.getElementById("story");

        let stories = [];

        let values = {};

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            const noun = document.getElementById("noun").value;
            const adjective = document.getElementById("adjective").value;
            const person = document.getElementById("person").value;
            const verb = document.getElementById("verb").value;
            const place = document.getElementById("place").value;

            if (
                noun === "" ||
                adjective === "" ||
                person === "" ||
                verb === "" ||
                place === ""
            ) {

                alert("Please fill all fields");

                return;

            }

            values = {
                noun,
                adjective,
                person,
                verb,
                place
            };

            createStories();

            showRandomStory();

        });

        function createStories() {

            stories = [

                `${values.person} went to ${values.place} with a ${values.adjective} ${values.noun} and started to ${values.verb}.`,

                `One day, ${values.person} found a ${values.adjective} ${values.noun} in ${values.place} and decided to ${values.verb}.`,

                `In ${values.place}, a ${values.adjective} ${values.noun} helped ${values.person} ${values.verb} all day long.`

            ];

        }

        function showRandomStory() {

            const randomIndex = Math.floor(Math.random() * stories.length);

            storySpan.textContent = stories[randomIndex];

        }

        document.getElementById("shuffle").addEventListener("click", function () {

            if (stories.length > 0) {

                showRandomStory();

            }

        });

    </script>

</body>

</html>
