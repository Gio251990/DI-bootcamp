<!DOCTYPE html>
<html>

<head>
    <!--Import Google Icon Font-->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!--Import materialize.css-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!--Let browser know website is optimized for mobile-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
</head>

<body>

    <!-- NAVBAR -->
    <nav>
        <div class="nav-wrapper teal">
            <a href="#" class="brand-logo" style="margin-left:10px;">My Landing</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="#">Home</a></li>
                <li><a href="#">Servizi</a></li>
                <li><a href="#">Contatti</a></li>
            </ul>
        </div>
    </nav>

    <!-- CONTENUTO -->
    <div class="container">
        <div class="row">

            <!-- CARD 1 -->
            <div class="col s12 m6">
                <div class="card hoverable">
                    <div class="card-image">
                        <img
                            src="https://images.pexels.com/photos/1287145/pexels-photo-1287145.jpeg?auto=compress&cs=tinysrgb&w=1600">
                        <span class="card-title">Card con Bottone</span>
                    </div>
                    <div class="card-content">
                        <p>Questa card contiene un bottone come call to action.</p>
                    </div>
                    <div class="card-action">
                        <a class="waves-effect waves-light btn">Azione</a>
                    </div>
                </div>
            </div>

            <!-- CARD 2 -->
            <div class="col s12 m6">
                <div class="card hoverable">
                    <div class="card-image">
                        <img
                            src="https://images.pexels.com/photos/1174732/pexels-photo-1174732.jpeg?auto=compress&cs=tinysrgb&w=1600">
                        <span class="card-title">Card con Link</span>
                    </div>
                    <div class="card-content">
                        <p>Questa card contiene un link cliccabile.</p>
                    </div>
                    <div class="card-action">
                        <a href="#">Scopri di più</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- FOOTER -->
    <footer class="page-footer teal">
        <div class="container">
            <div class="row">
                <div class="col s12">
                    <h5 class="white-text">Footer</h5>
                    <p class="grey-text text-lighten-4">Contenuto del footer della landing page.</p>
                </div>
            </div>
        </div>
        <div class="footer-copyright">
            <div class="container">
                © 2026 My Landing Page
            </div>
        </div>
    </footer>

    <!--JavaScript at end of body for optimized loading-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>

</html>
